<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070A14">
<title>聚佣宝 — 全网推广赚钱平台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#070A14;--bg2:#0C1122;--bg3:#111832;
--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.10);--glass3:rgba(255,255,255,.15);
--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
--primary:#7C5CFF;--primary-g:linear-gradient(135deg,#7C5CFF,#5C9CFF);
--accent:#69E7FF;--accent2:#62FAD3;--gold:#FFD66B;--warn:#FF6B6B;
--text:#F7FAFF;--text2:#9AA7C7;--text3:#5A6A8A;
--radius:14px;--radius-s:10px;--radius-xs:6px;
--shadow:0 4px 24px rgba(0,0,0,.4);
--safe-b:env(safe-area-inset-bottom,0px);
--nav-h:60px;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
html{font-family:var(--font);font-size:16px;color:var(--text);background:var(--bg);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body{min-height:100vh;min-height:100dvh;background:var(--bg);overflow-x:hidden;padding-bottom:calc(var(--nav-h) + var(--safe-b))}
body::before{content:'';position:fixed;top:-40%;left:-20%;width:80vw;height:80vw;background:radial-gradient(circle,rgba(124,92,255,.12),transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-30%;right:-20%;width:70vw;height:70vw;background:radial-gradient(circle,rgba(105,231,255,.08),transparent 70%);pointer-events:none;z-index:0}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text);background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-xs);padding:10px 14px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--primary)}
input::placeholder{color:var(--text3)}
img{max-width:100%;display:block}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 0 20px}
@media(min-width:520px){#app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
.header{position:sticky;top:0;z-index:100;padding:12px 16px;display:flex;align-items:center;gap:10px;background:rgba(7,10,20,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.header h1{font-size:18px;font-weight:700;flex:1;background:var(--primary-g);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .logo-icon{font-size:22px}
.header-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--glass);font-size:16px;transition:background .2s}
.header-btn:hover{background:var(--glass2)}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;background:rgba(7,10,20,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);z-index:200}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text3);font-size:10px;font-weight:500;transition:color .2s}
.nav-item.active{color:var(--accent)}
.nav-item .nav-icon{font-size:22px;line-height:1}
.nav-item.active .nav-icon{filter:drop-shadow(0 0 6px rgba(105,231,255,.4))}
.view{display:none;padding:16px;animation:fadeIn .25s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:border-color .2s}
.card:hover{border-color:var(--border2)}
.card-title{font-size:15px;font-weight:600;margin-bottom:8px}
.hero-banner{background:linear-gradient(135deg,rgba(124,92,255,.25),rgba(105,231,255,.15));border:1px solid rgba(124,92,255,.2);border-radius:var(--radius);padding:24px 20px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden}
.hero-banner::before{content:'';position:absolute;top:-50%;right:-30%;width:200px;height:200px;background:radial-gradient(circle,rgba(105,231,255,.15),transparent 70%);pointer-events:none}
.hero-banner h2{font-size:22px;font-weight:800;margin-bottom:6px}
.hero-banner p{font-size:13px;color:var(--text2);margin-bottom:14px}
.hero-banner .cta{display:inline-flex;align-items:center;gap:6px;padding:10px 24px;background:var(--primary-g);border-radius:20px;font-size:14px;font-weight:600;color:#fff;transition:transform .15s,box-shadow .15s}
.hero-banner .cta:hover{transform:scale(1.03);box-shadow:0 4px 20px rgba(124,92,255,.4)}
.platform-count{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:14px;font-size:12px;font-weight:600;background:rgba(98,250,211,.1);color:var(--accent2);border:1px solid rgba(98,250,211,.15);margin-bottom:16px}
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{flex:1;border-radius:20px;padding:10px 18px;background:var(--glass2);font-size:14px}
.search-bar button{border-radius:20px;padding:10px 18px;background:var(--primary-g);font-weight:600;font-size:14px;color:#fff;white-space:nowrap}
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;padding:7px 16px;border-radius:16px;font-size:12px;font-weight:500;background:var(--glass);border:1px solid var(--border);color:var(--text2);transition:all .2s;white-space:nowrap}
.cat-pill.active,.cat-pill:hover{background:rgba(124,92,255,.2);border-color:var(--primary);color:var(--text)}
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.product-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .15s,border-color .2s;cursor:pointer}
.product-card:hover{transform:translateY(-2px);border-color:var(--border2)}
.product-card .p-img{width:100%;aspect-ratio:1;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:38px;position:relative}
.product-card .p-tag{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;background:rgba(124,92,255,.8);color:#fff}
.product-card .p-body{padding:10px 12px}
.product-card .p-name{font-size:13px;font-weight:600;line-height:1.4;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-card .p-platform{font-size:10px;color:var(--text3);margin-bottom:6px}
.product-card .p-price{font-size:12px;color:var(--text2);margin-bottom:4px}
.product-card .p-price span{color:var(--warn);font-weight:700;font-size:15px}
.product-card .p-comm{display:flex;align-items:center;justify-content:space-between}
.product-card .p-comm-badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;background:rgba(98,250,211,.12);color:var(--accent2)}
.product-card .p-sales{font-size:10px;color:var(--text3)}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat-box{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-s);padding:14px 10px;text-align:center}
.stat-box .stat-val{font-size:22px;font-weight:800;background:var(--primary-g);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2}
.stat-box .stat-label{font-size:11px;color:var(--text3);margin-top:4px}
.stat-box.highlight .stat-val{background:linear-gradient(135deg,#62FAD3,#69E7FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.comm-section{margin-bottom:16px}
.comm-section h3{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text2)}
.comm-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-s);margin-bottom:6px}
.comm-row .comm-info{display:flex;align-items:center;gap:10px}
.comm-row .comm-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--glass2)}
.comm-row .comm-detail{font-size:13px}
.comm-row .comm-detail small{display:block;color:var(--text3);font-size:11px;margin-top:2px}
.comm-row .comm-amount{font-weight:700;color:var(--accent2);font-size:15px}
.comm-row .comm-amount.l2{color:var(--gold)}
.level-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600}
.level-badge.l1{background:rgba(98,250,211,.12);color:var(--accent2)}
.level-badge.l2{background:rgba(255,214,107,.12);color:var(--gold)}
.invite-card{background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(98,250,211,.1));border:1px solid rgba(124,92,255,.2);border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:16px}
.invite-card .code-display{font-size:28px;font-weight:800;letter-spacing:4px;color:var(--accent);margin:12px 0;padding:12px;background:var(--glass);border-radius:var(--radius-s);border:1px dashed var(--border2)}
.invite-card .invite-desc{font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.6}
.invite-card .invite-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.invite-card .invite-actions button{padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;transition:transform .15s}
.invite-card .invite-actions .btn-primary{background:var(--primary-g);color:#fff}
.team-member{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-s);margin-bottom:6px}
.team-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;background:var(--glass2);flex-shrink:0}
.team-info{flex:1;min-width:0}
.team-info .team-name{font-size:13px;font-weight:600}
.team-info .team-meta{font-size:11px;color:var(--text3);margin-top:2px}
.team-comm{font-size:13px;font-weight:700;color:var(--accent2);white-space:nowrap}
.profile-header{text-align:center;padding:24px 0}
.profile-avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--primary-g);box-shadow:0 4px 20px rgba(124,92,255,.3)}
.profile-header .profile-name{font-size:18px;font-weight:700}
.profile-header .profile-role{font-size:12px;color:var(--text3);margin-top:4px}
.menu-list{margin-bottom:12px}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-s);margin-bottom:6px;transition:background .2s;cursor:pointer}
.menu-item:hover{background:var(--glass2)}
.menu-item .menu-icon{font-size:20px;width:28px;text-align:center}
.menu-item .menu-text{flex:1;font-size:14px;font-weight:500}
.menu-item .menu-arrow{color:var(--text3);font-size:14px}
.menu-item .menu-badge{padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600;background:rgba(255,107,107,.15);color:var(--warn)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:500;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal-content{width:100%;max-width:480px;max-height:90vh;background:var(--bg2);border-top:1px solid var(--border2);border-radius:20px 20px 0 0;overflow-y:auto;padding:24px 20px calc(24px + var(--safe-b));animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-content.center-modal{border-radius:var(--radius);max-width:380px;margin:auto;border:1px solid var(--border2)}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--glass2);display:flex;align-items:center;justify-content:center;font-size:18px;z-index:1}
.login-form{text-align:center}
.login-form h2{font-size:22px;font-weight:700;margin-bottom:6px}
.login-form .login-sub{font-size:13px;color:var(--text3);margin-bottom:24px}
.login-form .form-group{margin-bottom:14px;text-align:left}
.login-form .form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500}
.login-form .form-btn{width:100%;padding:14px;border-radius:12px;background:var(--primary-g);font-size:15px;font-weight:600;color:#fff;margin-top:8px;transition:transform .15s}
.login-form .form-btn:hover{transform:scale(1.01)}
.login-form .form-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--text3)}
.login-form .form-switch a{color:var(--accent);font-weight:500}
.invite-input-hint{font-size:11px;color:var(--text3);margin-top:4px}
.admin-section{margin-bottom:20px}
.admin-section h3{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:10px}
.admin-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.admin-tab{padding:7px 14px;border-radius:14px;font-size:12px;font-weight:500;background:var(--glass);border:1px solid var(--border);color:var(--text3);white-space:nowrap;flex-shrink:0;cursor:pointer}
.admin-tab.active{background:rgba(124,92,255,.2);border-color:var(--primary);color:var(--text)}
.admin-user-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-s);margin-bottom:4px;font-size:12px;flex-wrap:wrap}
.admin-user-row .a-name{font-weight:600;min-width:60px}
.admin-user-row .a-code{color:var(--accent);font-family:monospace}
.admin-user-row .a-stat{color:var(--text2)}
.admin-user-row .a-actions{margin-left:auto;display:flex;gap:4px}
.admin-user-row .a-btn{padding:4px 10px;border-radius:6px;font-size:11px;background:var(--glass2);border:1px solid var(--border);cursor:pointer}
.admin-user-row .a-btn.danger{color:var(--warn);border-color:rgba(255,107,107,.3)}
.admin-user-row .a-btn:hover{background:var(--glass3)}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);padding:10px 24px;border-radius:20px;font-size:13px;font-weight:500;background:rgba(98,250,211,.15);border:1px solid rgba(98,250,211,.3);color:var(--accent2);z-index:999;opacity:0;transition:all .3s;pointer-events:none;backdrop-filter:blur(8px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:rgba(255,107,107,.15);border-color:rgba(255,107,107,.3);color:var(--warn)}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .empty-icon{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:13px;line-height:1.6}
.pd-img{width:100%;aspect-ratio:1;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:64px;border-radius:var(--radius);margin-bottom:16px}
.pd-name{font-size:17px;font-weight:700;line-height:1.4;margin-bottom:10px}
.pd-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pd-meta span{padding:3px 10px;border-radius:10px;font-size:11px;background:var(--glass2);color:var(--text2)}
.pd-price-row{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.pd-price{font-size:24px;font-weight:800;color:var(--warn)}
.pd-comm-badge{padding:4px 12px;border-radius:12px;font-size:13px;font-weight:600;background:rgba(98,250,211,.12);color:var(--accent2)}
.pd-desc{font-size:13px;color:var(--text2);line-height:1.7;margin:14px 0}
.pd-go{display:block;width:100%;padding:14px;border-radius:12px;background:var(--primary-g);font-size:15px;font-weight:600;color:#fff;text-align:center;transition:transform .15s;cursor:pointer}
.pd-go:hover{transform:scale(1.01)}
.share-options{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.share-opt{text-align:center;padding:14px 6px;border-radius:var(--radius-s);background:var(--glass);border:1px solid var(--border);transition:background .2s;cursor:pointer}
.share-opt:hover{background:var(--glass2)}
.share-opt .share-opt-icon{font-size:26px;margin-bottom:6px}
.share-opt .share-opt-text{font-size:11px;color:var(--text2)}
.share-link-box{display:flex;gap:8px;margin-top:12px}
.share-link-box input{flex:1;font-size:12px;border-radius:8px;padding:10px 12px}
.share-link-box button{padding:10px 16px;border-radius:8px;background:var(--primary-g);font-size:13px;font-weight:600;color:#fff;white-space:nowrap;cursor:pointer}
.platform-category-header{display:flex;align-items:center;gap:8px;padding:12px 0 8px;margin-top:4px}
.platform-category-header .pch-icon{font-size:18px}
.platform-category-header .pch-name{font-size:14px;font-weight:600;color:var(--text)}
.platform-category-header .pch-count{font-size:11px;color:var(--text3);background:var(--glass);padding:2px 8px;border-radius:8px}
@media print{
body{background:#fff;color:#000;padding:0}
.bottom-nav,.header,.modal-overlay,.toast{display:none!important}
.card,.hero-banner,.product-card,.stat-box,.invite-card{border:1px solid #ccc;background:#f5f5f5;break-inside:avoid}
.card-title,.product-card .p-name,.stat-box .stat-val,.hero-banner h2{-webkit-text-fill-color:#000;color:#000}
}
</style>
</head>
<body>
<div id="app">
  <header class="header" id="mainHeader">
    <span class="logo-icon" aria-hidden="true">💎</span>
    <h1>聚佣宝</h1>
    <button class="header-btn" id="btnNotif" title="消息" aria-label="消息通知">🔔</button>
    <button class="header-btn" id="btnSearch" title="搜索" aria-label="搜索商品">🔍</button>
  </header>
  <main>
    <section class="view active" id="viewHome" aria-label="首页">
      <div class="hero-banner">
        <h2>全网50+推广平台 一站赚钱</h2>
        <p>覆盖网盘拉新、APP推广、电商CPS、AI等12大行业</p>
        <button class="cta" onclick="openModal('modalLogin')" id="heroCta">🚀 立即加入</button>
      </div>
      <div class="platform-count" id="platformCount">📡 已接入 50 个推广平台</div>
      <div class="search-bar">
        <input type="search" id="searchInput" placeholder="搜索商品、平台、分类..." aria-label="搜索商品">
        <button onclick="doSearch()">搜索</button>
      </div>
      <div class="cat-scroll" id="catScroll" role="tablist" aria-label="商品分类"></div>
      <div class="product-grid" id="productGrid"></div>
    </section>
    <section class="view" id="viewEarnings" aria-label="收益"><div id="earningsContent"></div></section>
    <section class="view" id="viewTeam" aria-label="团队"><div id="teamContent"></div></section>
    <section class="view" id="viewProfile" aria-label="我的"><div id="profileContent"></div></section>
  </main>
  <nav class="bottom-nav" role="navigation" aria-label="主导航">
    <button class="nav-item active" data-view="viewHome" onclick="switchView('viewHome',this)"><span class="nav-icon">🏠</span><span>首页</span></button>
    <button class="nav-item" data-view="viewEarnings" onclick="switchView('viewEarnings',this)"><span class="nav-icon">💰</span><span>收益</span></button>
    <button class="nav-item" data-view="viewTeam" onclick="switchView('viewTeam',this)"><span class="nav-icon">👥</span><span>团队</span></button>
    <button class="nav-item" data-view="viewProfile" onclick="switchView('viewProfile',this)"><span class="nav-icon">👤</span><span>我的</span></button>
  </nav>
</div>
<div class="modal-overlay" id="modalLogin"><div class="modal-content center-modal" role="dialog" aria-label="登录注册"><button class="modal-close" onclick="closeModal('modalLogin')" aria-label="关闭">×</button>
  <div class="login-form" id="loginForm"><h2>欢迎来到聚佣宝</h2><p class="login-sub">登录开启你的推广赚钱之旅</p>

  var u=users();

}

function renderProducts(){
  var ps=PLATFORMS;
  if(searchQ){var q=searchQ.toLowerCase();ps=ps.filter(function(p){return p.name.toLowerCase().indexOf(q)>=0||p.platform.toLowerCase().indexOf(q)>=0||p.cat.toLowerCase().indexOf(q)>=0})}
  if(curCat!=='全部')ps=ps.filter(function(p){return p.cat===curCat});
  var h='';
  ps.forEach(function(p){
    var tag=p.tags&&p.tags.length>0?'<span class="p-tag">'+p.tags[0]+'</span>':'';
    var cmText=p.commission>0?'¥'+p.commission:p.rate;
    h+='<div class="product-card" onclick="openProduct(\''+p.id+'\')" tabindex="0" role="button" aria-label="'+p.name+'">';
    h+='<div class="p-img">'+tag+p.emoji+'</div>';
    h+='<div class="p-body">';
    h+='<div class="p-name">'+p.name+'</div>';
    h+='<div class="p-platform">'+p.platform+' · '+p.cat+'</div>';
    h+='<div class="p-price">佣金 <span>'+cmText+'</span></div>';
    h+='<div class="p-comm"><span class="p-comm-badge">'+p.rate+'</span><span class="p-sales">'+fmtN(p.sales)+'人</span></div>';
    h+='</div></div>'
  });
  if(ps.length===0)h='<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🔍</div><p>暂无相关商品</p></div>';
  document.getElementById('productGrid').innerHTML=h;
  document.getElementById('platformCount').textContent='📡 已接入 '+PLATFORMS.length+' 个推广平台';
}
function fmtN(n){if(n>=10000)return(n/10000).toFixed(1)+'万';if(n>=1000)return(n/1000).toFixed(1)+'k';return n}

function openProduct(id){
  var p=PLATFORMS.find(function(x){return x.id===id});if(!p)return;
  var cm=p.commission>0?'¥'+p.commission:p.rate;
  var h='<div class="pd-img">'+p.emoji+'</div>';
  h+='<div class="pd-name">'+p.name+'</div>';
  h+='<div class="pd-meta"><span>'+p.platform+'</span><span>'+p.cat+'</span>';
  if(p.tags)p.tags.forEach(function(t){h+='<span>'+t+'</span>'});
  h+='</div>';
  h+='<div class="pd-price-row"><span class="pd-price">佣金 '+cm+'</span><span class="pd-comm-badge">'+p.rate+'</span></div>';
  h+='<p style="font-size:12px;color:var(--text3);margin-bottom:8px">'+fmtN(p.sales)+'人已参与推广</p>';
  h+='<div class="pd-desc">通过分享推广链接，邀请好友注册或使用即可获得佣金。佣金实时到账，支持随时提现。平台提供专属推广链接，自动追踪转化。</div>';
  curUser=DS.cur();
  if(curUser)h+='<button class="pd-go" onclick="goPromote(\''+p.id+'\')">🔗 获取推广链接</button>';
  else h+='<button class="pd-go" onclick="openModal(\'modalLogin\')">🔐 登录后获取推广链接</button>';
  document.getElementById('productDetail').innerHTML=h;
  openModal('modalProduct');
}

function filterApi(){
  var q=(document.getElementById('apiSearch').value||'').toLowerCase();
  var cat=document.getElementById('apiCatFilter').value;
  var items=document.querySelectorAll('.api-item');
  var groups=document.querySelectorAll('.cat-group');
  items.forEach(function(el){
    var match=(!q||el.getAttribute('data-name').toLowerCase().indexOf(q)>-1)&&(!cat||el.getAttribute('data-cat')===cat);
    el.style.display=match?'':'none'
  });
  groups.forEach(function(el){
    var c=el.getAttribute('data-cat');
    var show=!cat||c===cat;
    el.style.display=show?'':'none'
  })
}
function saveAllApi(){
  var apiCfg={};
  for(var i=1;i<=50;i++){
    var id='p'+(i<10?'0'+i:i);
    var k1=document.getElementById('ak_'+id);
    var k2=document.getElementById('as_'+id);
    if(k1&&k2&&(k1.value||k2.value)){
      apiCfg[id]={k1:k1.value,k2:k2.value}
    }
  }
  localStorage.setItem('jyb_api',JSON.stringify(apiCfg));
  var cnt=Object.keys(apiCfg).length;
  document.getElementById('apiCountDone').textContent=cnt;
  document.querySelectorAll('.api-item').forEach(function(el){
    var id=el.querySelector('[id^="ak_"]');
    if(id){
      var pid=id.id.replace('ak_','');
      var stEl=document.getElementById('st_'+pid);
      if(stEl){
        var configured=apiCfg[pid]&&apiCfg[pid].k1;
        stEl.textContent=configured?'✓ 已配置':'未配置';
        stEl.style.cssText='font-size:10px;padding:2px 8px;border-radius:10px;'+(configured?'background:rgba(0,245,212,.15);color:var(--accent)':'background:var(--glass2);color:var(--text3)')
      }
    }
  });
  toast('已保存 '+cnt+' 个平台的API配置')
}
function updateApiCount(){
  var apiCfg=JSON.parse(localStorage.getItem('jyb_api')||'{}');
  var el=document.getElementById('apiCountDone');
  if(el)el.textContent=Object.keys(apiCfg).length
}
